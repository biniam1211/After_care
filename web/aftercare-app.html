:root{--font-bricolage:"Bricolage";--font-jakarta:"Jakarta";}
/* ───────────────────────────────────────────────────────────
   AfterCare — global tokens, resets, animations
   Ported from the Claude Design prototype (AfterCare_Standalone).
   ─────────────────────────────────────────────────────────── */

:root {
  /* Ocean / harbor */
  --harbor: #06283d;
  --harbor-2: #0b3a57;
  --harbor-3: #12496b;
  --sky: #2e9bff;
  --sky-press: #1b7fe0;
  --sky-soft: #e7f4ff;
  --mist: #dbf1ff;
  --foam: #f1f8fd;
  --card: #ffffff;
  --ink: #0a2536;
  --ink-soft: #50677a;
  --ink-faint: #93a8b6;
  --line: #e5eff5;
  --line-soft: #eff5f9;
  /* Warmth */
  --warm: #ff9e57;
  --warm-deep: #f2823a;
  --warm-soft: #fff2e7;
  /* Success */
  --mint: #17b98a;
  --mint-soft: #e2f7ef;
  /* Emergency — reserved */
  --panic: #ff3b41;
  --panic-deep: #dd2129;
  --panic-soft: #ffeaeb;

  --r-xl: 32px;
  --r-lg: 26px;
  --r: 20px;
  --r-sm: 14px;
  --r-xs: 10px;

  --shadow-card: 0 1px 2px rgba(6, 40, 61, 0.05), 0 8px 24px rgba(6, 40, 61, 0.06);
  --shadow-pop: 0 12px 38px rgba(6, 40, 61, 0.18);
  --shadow-fab: 0 8px 22px rgba(221, 33, 41, 0.42);

  /* --font-jakarta / --font-bricolage are injected by next/font (see layout.jsx) */
  --sans: var(--font-jakarta), -apple-system, system-ui, sans-serif;
  --display: var(--font-bricolage), var(--font-jakarta), -apple-system, system-ui, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--sans);
  background: radial-gradient(1200px 700px at 18% -8%, #103a55 0%, transparent 55%),
    radial-gradient(1000px 800px at 110% 110%, #0a2f48 0%, transparent 60%), #061c2b;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

input {
  font-family: inherit;
}

a {
  color: inherit;
}

.no-scrollbar {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}

/* Center + scale the phone so the whole device is visible on any viewport */
#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#scaler {
  transform: scale(var(--scale, 1));
  transform-origin: center center;
  transition: transform 0.2s ease;
}

/* ── Animations ── */
@keyframes ac-rise {
  from {
    transform: translateY(16px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
@keyframes ac-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes ac-pop {
  0% {
    transform: scale(0.9);
  }
  60% {
    transform: scale(1.02);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes ac-dots {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: 0.4;
  }
  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}
@keyframes ac-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(255, 59, 65, 0.5);
  }
  70% {
    box-shadow: 0 0 0 16px rgba(255, 59, 65, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(255, 59, 65, 0);
  }
}
@keyframes ac-sheen {
  from {
    transform: translateX(-120%);
  }
  to {
    transform: translateX(220%);
  }
}

 no-fee account \u2014 Chime, Current, or Capital One 360. No minimum balance, no surprise charges.","Set up direct deposit so you skip check-cashing places (they steal 3\u20135% of every check)."],resources:["ifoster-bank","rightway"],followup:"Want me to turn this into a step-by-step Quest so I can check in with you after each part?",quest:"first-bank-account"},college:{answer:`Here's the part nobody tells you: because you were in foster care after age 13, the FAFSA counts you as an "independent student." That means you don't need a parent's income or signature \u2014 and you likely qualify for the most aid available.`,steps:['File the FAFSA at studentaid.gov \u2014 answer "yes" to the foster care question to unlock independent status.',"Apply for the California Chafee Grant (up to $5,000/yr, just for foster youth) before the May deadline.","Ask each college about their foster-youth tuition waiver \u2014 40+ states waive tuition at public colleges."],resources:["jbay","chafee-grant"],followup:"The Chafee Grant alone is up to $5k a year. Want me to walk you through claiming it?",quest:"chafee-grant"},chafee:{answer:"The Chafee Grant is free money \u2014 up to $5,000 a year for school or job training, and you never pay it back. If you were in foster care between 16 and 18 and you're under 26, you almost certainly qualify.",steps:["Check the boxes: were you in care between 16\u201318? Under 26? Enrolled (or about to enroll) at least half-time? That's it.","File your FAFSA or CA Dream Act application first \u2014 Chafee needs it.","Apply at chafee.csac.ca.gov. It takes about 15 minutes."],resources:["chafee-grant","jbay"],followup:"Want me to set this up as a Quest and remind you before the deadline?",quest:"chafee-grant"},health:{answer:"Good news \u2014 if you were in foster care at 18, you keep free Medicaid (Medi-Cal in CA) until you turn 26. No income limit, no application stress. Most foster youth never find out, so they go uninsured. Don't be one of them.",steps:["You're auto-eligible for the Former Foster Youth Medi-Cal program \u2014 you don't re-qualify every year.",'If your coverage lapsed, call your county Medi-Cal office and say the words "former foster youth."',"Keep your address updated with the county so renewal notices actually reach you."],resources:["medical-ffy","211"],followup:"Want a Quest that locks in your coverage to 26 step by step?",quest:"health-26"},kicked:{answer:"Okay \u2014 first, breathe. You are not in trouble and you're not alone tonight. If this is happening right now, the fastest help is one tap away with the Panic Button below. Let's make sure you're safe first, then sort the rest.",steps:["If you feel unsafe, tap the red Panic Button \u2014 I'll pull up a shelter near you in seconds.","You have a right to emergency housing. Covenant House (1-800-388-3888) takes youth 24/7, no questions.","Text your caseworker now \u2014 I can draft the message for you so you don't have to find the words."],resources:["covenant","211"],panic:!0},default:{answer:"I've got you. Give me a second to think this through with you \u2014 I'll always give you a straight answer, the next few steps, and real places near you that can help. Nothing here gets judged.",steps:["Tell me a little more \u2014 your city or ZIP helps me find help that's actually close to you.","If this is an emergency, the red Panic Button gets you immediate local help.","Anything you ask stays private. Always."],resources:["211","rightway"]}},Ve={covenant:{name:"Covenant House California",cat:"Housing",catColor:"sky",blurb:"24/7 emergency shelter & crisis care for youth 18\u201324. Walk in any time.",meta:"Open now \xB7 1.2 mi \xB7 Hollywood",phone:"1-800-388-3888",tag:"Open 24/7"},211:{name:"211 LA / OC",cat:"All-in-one",catColor:"harbor",blurb:"Free helpline that connects you to housing, food, and health resources near you.",meta:"Call or text \xB7 Countywide",phone:"211",tag:"Free"},rightway:{name:"RightWay Foundation",cat:"Money & Jobs",catColor:"warm",blurb:"Job training, financial coaching, and mental health support built for foster youth.",meta:"1.0 mi \xB7 South LA",phone:"(323) 463-1000",tag:"Foster-specific"},james:{name:"James Storehouse",cat:"Essentials",catColor:"mint",blurb:"Free clothing, supplies, and wraparound support when you're starting from zero.",meta:"Newbury Park \xB7 Ventura",phone:"(805) 367-7038",tag:"Free supplies"},"ifoster-bank":{name:"iFoster \u2014 Banking Help",cat:"Money & Jobs",catColor:"warm",blurb:"Walks you through opening a no-fee bank account, no co-signer needed.",meta:"Online \xB7 Statewide",phone:null,tag:"Step-by-step"},jbay:{name:"John Burton Advocates for Youth",cat:"Education",catColor:"sky",blurb:"Free help with FAFSA, college applications, and foster-youth tuition waivers.",meta:"Online \xB7 Statewide",phone:"(415) 348-1290",tag:"College"},"chafee-grant":{name:"California Chafee Grant",cat:"Education",catColor:"sky",blurb:"Up to $5,000/yr for college or job training. You never pay it back.",meta:"chafee.csac.ca.gov",phone:null,tag:"Up to $5k/yr"},"medical-ffy":{name:"Former Foster Youth Medi-Cal",cat:"Health",catColor:"mint",blurb:"Free health coverage until age 26 \u2014 no income limit. Auto-eligible if you aged out.",meta:"County Medi-Cal office",phone:"1-800-541-5555",tag:"Free to 26"},988:{name:"988 Suicide & Crisis Lifeline",cat:"Crisis",catColor:"panic",blurb:"Call or text 988 any time to talk to someone right now. Free and confidential.",meta:"24/7 \xB7 Nationwide",phone:"988",tag:"Open 24/7"},trevor:{name:"The Trevor Project",cat:"Crisis",catColor:"panic",blurb:"Crisis support for LGBTQ+ young people, 24/7. Call, text, or chat.",meta:"24/7 \xB7 Nationwide",phone:"1-866-488-7386",tag:"LGBTQ+ \xB7 24/7"}},vy=[{id:"all",label:"All",icon:"grid"},{id:"Housing",label:"Housing",icon:"home"},{id:"Money & Jobs",label:"Money & Jobs",icon:"cash"},{id:"Health",label:"Health",icon:"health"},{id:"Education",label:"School",icon:"grad"},{id:"Crisis",label:"Crisis",icon:"shield"},{id:"Essentials",label:"Essentials",icon:"box"}],Ae=[{slug:"first-bank-account",title:"Get Your First Bank Account",tagline:"No parent. No co-signer. No fees.",icon:"bank",color:"sky",minutes:20,why:"A bank account is the foundation of everything \u2014 getting paid, saving, building credit. Most foster kids don't have one, and check-cashing places quietly steal 3\u20135% of every paycheck.",steps:[{title:"Get your ID together",what:"You'll need a government photo ID, your Social Security number, and proof of address.",why:"Banks are legally required to verify who you are. No exceptions \u2014 but your ID is enough.",action:"Gather your ID + SSN. No printer needed.",check:"Got your ID and SSN ready?"},{title:"Pick a bank with no fees",what:"Most banks charge $5\u201315/month. You want a fee-free one.",why:"$15/month is $180/year \u2014 that's a phone bill you'd be paying for nothing.",action:"Open Chime, Current, or Capital One 360.",check:"Did the application go through?"},{title:"Set up direct deposit",what:"Get paid up to 2 days early and skip check-cashing fees.",why:"Check-cashing places take 3\u20135% of your paycheck. Direct deposit is free.",action:"Give your employer the routing + account numbers from the app.",check:"Direct deposit set up?"},{title:"Turn off overdraft fees",what:"Stop the bank charging you $35 every time a card declines.",why:"One bad week can be $200 in overdraft fees. Switch it off.",action:"Open the bank app \u2192 Settings \u2192 turn off overdraft.",check:"Overdraft protection sorted?"},{title:"Start the $20/week habit",what:"Auto-transfer $20/week to savings \u2014 $1,040/year without thinking about it.",why:"A $1,000 emergency fund is the single thing that changes your life after care.",action:"Open the app \u2192 Recurring Transfer \u2192 $20/week.",check:"Auto-save running?"}]},{slug:"credit",title:"Build Your Credit Score",tagline:"Start from nothing, the safe way.",icon:"chart",color:"warm",minutes:15,why:"Credit decides whether you can rent an apartment, get a car, or skip huge deposits. Foster kids usually start with no credit \u2014 and sometimes with fraud on their record from someone using their SSN. You can build it safely, starting today.",steps:[{title:"Check your credit for free",what:"Pull all three credit reports free at AnnualCreditReport.com.",why:"Kids in care are often victims of identity theft. Catching a fake account early saves years of cleanup.",action:"Go to AnnualCreditReport.com and request your reports.",check:"Reviewed your reports for accounts you didn't open?"},{title:"Dispute anything that isn't yours",what:"If you see accounts or debts you never created, dispute them in writing.",why:"You are not responsible for fraud committed against you as a minor.",action:"File a dispute with each bureau online. A JBAY advocate or caseworker can help.",check:"Disputed anything suspicious?"},{title:"Open a credit-builder",what:"A secured card (small deposit) or a credit-builder account reports your on-time payments.",why:"It's the safest way to start credit with no history and no risk of overspending.",action:"Open a secured card, or a builder like Chime Credit Builder or Self.",check:"Credit-builder account opened?"},{title:"Use it tiny, pay it in full",what:"Put one small recurring bill on it and pay the whole balance every month.",why:"Staying under 30% of your limit and never carrying a balance raises your score fastest.",action:"Set the card to autopay the full statement balance.",check:"Autopay set to the full balance?"},{title:"Check back in 3 months",what:"A score usually appears after 3\u20136 months of on-time payments.",why:"Watching it climb tells you it's working \u2014 and you're now rentable and loanable.",action:"Check your score free in your bank app or Credit Karma.",check:"Watching your score grow?"}]},{slug:"chafee-grant",title:"Claim Your Chafee Grant",tagline:"Up to $5,000/yr for school.",icon:"cash",color:"mint",minutes:15,why:"The Chafee Grant is up to $5,000 a year for college or job training that you never pay back. If you were in foster care between 16 and 18 and you're under 26, you almost certainly qualify \u2014 but you have to apply every year.",steps:[{title:"Confirm you qualify",what:"You need at least one day in care between 16 and 18, be under 26, and be enrolled at least half-time.",why:"Most eligible youth never claim it because no one tells them they qualify.",action:"Check the boxes: in care 16\u201318, under 26, half-time student.",check:"Do you meet all three?"},{title:"File your FAFSA first",what:"Chafee needs a completed FAFSA at studentaid.gov (or a CA Dream Act app if undocumented).",why:"The grant is tied to your financial-aid file \u2014 no FAFSA, no Chafee.",action:'File your FAFSA and answer "yes" to the foster-care question.',check:"FAFSA (or Dream Act app) submitted?"},{title:"Apply at chafee.csac.ca.gov",what:"The Chafee application itself takes about 15 minutes.",why:"This is the actual grant form \u2014 the FAFSA alone doesn't do it.",action:"Go to chafee.csac.ca.gov and complete the Chafee form.",check:"Chafee application submitted?"},{title:"Tell your school",what:"Your school's financial-aid office confirms enrollment so the money can pay out.",why:"The grant pays through your school \u2014 they need to know you claimed it.",action:"Email financial aid that you've applied for the Chafee Grant.",check:"Financial-aid office notified?"},{title:"Set a reminder to reapply",what:"Chafee is annual \u2014 you re-file the FAFSA and Chafee app each year until 26.",why:"Miss a year and you leave up to $5,000 on the table.",action:"Set a reminder for next January to reapply.",check:"Reminder set to reapply?"}]},{slug:"health-26",title:"Keep Health Insurance to 26",tagline:"Free coverage you already qualify for.",icon:"health",color:"sky",minutes:10,why:"If you were in foster care on your 18th birthday, you keep free Medi-Cal until you turn 26 \u2014 no income limit, no yearly
