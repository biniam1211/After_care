<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 56 56">
  <!-- AfterCare mark: a sunrise over a calm horizon in a rounded tile —
       "after" the storm. Mirrors the Logo component in components/onboarding.jsx
       so the browser tab matches what the app shows on its welcome screen. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41B0FF"/>
      <stop offset="0.45" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#1B7FE0"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="17" fill="url(#tile)"/>
  <circle cx="28" cy="33" r="9" fill="#FFE7C7" opacity="0.95"/>
  <circle cx="28" cy="33" r="9" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M8 38h40" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M13 44h30" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#FFE7C7" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <path d="M28 17v4"/>
    <path d="M40 21l-2.5 3"/>
    <path d="M16 21l2.5 3"/>
  </g>
</svg>
