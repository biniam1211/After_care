name: AfterCare reminders

# Alternative to Vercel Cron for the web app's scheduled reminders
# (panic check-ins + quest nudges). Set repo secrets APP_URL and CRON_SECRET.
on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set — skipping"; exit 0; fi
          curl -fsS -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
