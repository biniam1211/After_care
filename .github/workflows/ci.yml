name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The production build is the real gate here: it typechecks, compiles
      # every route, and is exactly what Vercel runs on each push.
      - run: npm run build

  app:
    name: App — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  api:
    name: API — typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+, not 20: @supabase/realtime-js requires a native
          # WebSocket, which Node 20 does not provide. api/Dockerfile was
          # already moved to Node 22 for this same reason (ebf49f0) — this
          # is the workflow catching up.
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
